name: CI - Core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  core:
    name: Core diagnostics (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Core diagnostics fixture
        id: tests
        env:
          PM_TEST_RESULTS: ${{ runner.temp }}/core-results.json
        run: node scripts/test/run-diagnostics-tests.js "$RUNNER_TEMP/pathmend-unit"
      - name: Publish test summary and annotations
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/reporting/write-summary.js core "$RUNNER_TEMP/core-results.json"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pathmend-core-results
          path: ${{ runner.temp }}/core-results.json
          retention-days: 14
          if-no-files-found: warn
