name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and core tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Core diagnostics fixture
        run: node test/unit.js "$RUNNER_TEMP/pathmend-unit"

  vscode:
    name: VS Code integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PM_SCREENSHOTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Run trusted and untrusted workspace tests
        run: xvfb-run -a node test/run-vscode.js
