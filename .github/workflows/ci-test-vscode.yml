name: CI - VS Code
run-name: ${{ (inputs.screenshots || github.event_name == 'pull_request') && 'CI - VS Code (screenshots)' || 'CI - VS Code' }} · ${{ github.head_ref || github.ref_name }} · #${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'views/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/vscode/**'
      - 'test/fixtures/**'
      - 'test/run-vscode.js'
      - 'test/prepare.js'
      - 'test/expected.js'
      - 'test/write-summary.js'
      - '.github/workflows/ci-test-vscode.yml'
  pull_request:
    paths:
      - '*.js'
      - 'views/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/vscode/**'
      - 'test/fixtures/**'
      - 'test/run-vscode.js'
      - 'test/prepare.js'
      - 'test/expected.js'
      - 'test/write-summary.js'
      - '.github/workflows/ci-test-vscode.yml'
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture VS Code screenshots
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  vscode:
    name: VS Code integration tests${{ (inputs.screenshots || github.event_name == 'pull_request') && ' (screenshots)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PM_SCREENSHOTS: ${{ (inputs.screenshots || github.event_name == 'pull_request') && '1' || '0' }}
      PM_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Run trusted and untrusted workspace tests
        id: tests
        env:
          PM_TEST_RESULTS: ${{ runner.temp }}/vscode-results.json
        run: xvfb-run -a -s "-screen 0 1920x1080x24" node test/run-vscode.js
      - name: Publish test summary and annotations
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node test/write-summary.js vscode "$RUNNER_TEMP/vscode-results.json"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pathmend-vscode-results
          path: ${{ runner.temp }}/vscode-results.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload screenshots
        if: ${{ always() && (inputs.screenshots || github.event_name == 'pull_request') }}
        uses: actions/upload-artifact@v7
        with:
          name: pathmend-vscode-screenshots
          path: screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
