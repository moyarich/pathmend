name: CI - Vitest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  unit:
    name: Vitest (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Vitest
        id: tests
        run: npm test -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-results.json"
      - name: Publish test summary and annotations
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node test/reporting/write-summary.js vitest "$RUNNER_TEMP/vitest-results.json"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pathmend-vitest-results
          path: ${{ runner.temp }}/vitest-results.json
          retention-days: 14
          if-no-files-found: warn
